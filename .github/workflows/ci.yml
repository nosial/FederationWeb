name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/ncc:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The build compiles the stylesheets, scripts and vendor assets with npm (see project.yml)
      - name: Install Node.js
        run: |
          apt-get update && apt-get install -y nodejs npm && rm -rf /var/lib/apt/lists/*

      - name: Build project
        run: |
          ncc project install --log-level debug -y
          ncc build --config debug --log-level debug

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: target/debug/net.nosial.federationweb.ncc

  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/ncc:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The build compiles the stylesheets, scripts and vendor assets with npm (see project.yml)
      - name: Install Node.js
        run: |
          apt-get update && apt-get install -y nodejs npm && rm -rf /var/lib/apt/lists/*

      - name: Build project
        run: |
          ncc project install --log-level debug -y
          ncc build --config release --log-level debug

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: target/release/net.nosial.federationweb.ncc

  web_release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/ncc:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The build compiles the stylesheets, scripts and vendor assets with npm (see project.yml)
      - name: Install Node.js
        run: |
          apt-get update && apt-get install -y nodejs npm && rm -rf /var/lib/apt/lists/*

      - name: Build project
        run: |
          ncc project install --log-level debug -y
          ncc build --config web_release --log-level debug

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web_release
          path: target/web_release/net.nosial.federationweb.ncc

  # Check for phpunit.xml
  check-phpunit:
    runs-on: ubuntu-latest
    outputs:
      phpunit-exists: ${{ steps.check.outputs.phpunit-exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check for phpunit.xml
        id: check
        run: |
          if [ -f phpunit.xml ]; then
            echo "phpunit-exists=true" >> $GITHUB_OUTPUT
          else
            echo "phpunit-exists=false" >> $GITHUB_OUTPUT
          fi

  # Check for phpdoc.dist.xml
  check-phpdoc:
    runs-on: ubuntu-latest
    outputs:
      phpdoc-exists: ${{ steps.check.outputs.phpdoc-exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check for phpdoc.dist.xml
        id: check
        run: |
          if [ -f phpdoc.dist.xml ]; then
            echo "phpdoc-exists=true" >> $GITHUB_OUTPUT
          else
            echo "phpdoc-exists=false" >> $GITHUB_OUTPUT
          fi




  release-artifacts:
    needs: [debug, release, web_release]
    permissions: write-all
    runs-on: ubuntu-latest
    container:
      image: php:8.5
    # Pushing a tag creates the release and attaches the packages; a release created by another
    # workflow's GITHUB_TOKEN would not start this one, so the release is created here.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download debug artifact
        uses: actions/download-artifact@v8
        with:
          name: debug
          path: debug

      - name: Check for an existing release
        id: existing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug artifact to release
        uses: softprops/action-gh-release@v3
        with:
            name: ${{ steps.existing.outputs.exists != 'true' && format('Release {0}', github.ref_name) || '' }}
            prerelease: ${{ contains(github.ref_name, '-') }}
            generate_release_notes: ${{ steps.existing.outputs.exists != 'true' }}
            files: |
                debug/*
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Upload release artifact to release
        uses: softprops/action-gh-release@v3
        with:
            files: |
                release/*
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web_release artifact
        uses: actions/download-artifact@v8
        with:
          name: web_release
          path: web_release

      - name: Upload web_release artifact to release
        uses: softprops/action-gh-release@v3
        with:
            files: |
                web_release/*
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


